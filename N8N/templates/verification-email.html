<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your ReplyFlow verification code</title>
  </head>
  <body style="margin:0; padding:0; background:#ffffff; color:#000000; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px; border:1px solid #000000;">
            <tr>
              <td style="padding:28px 32px 16px;">
                <div style="color:#9d7a3c; font-size:12px; font-weight:700; letter-spacing:1.5px; line-height:16px;">REPLYFLOW ACCOUNT</div>
                <h1 style="margin:14px 0 0; color:#000000; font-size:28px; line-height:34px;">Verify your email</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px;">
                <p style="margin:0 0 24px; color:#000000; font-size:16px; line-height:24px;">Use this code to verify your email and access the client information assigned to you.</p>
                <div style="margin:0 0 24px; padding:18px; background:#f5f5f5; border:1px solid #000000; color:#000000; font-size:32px; font-weight:700; letter-spacing:8px; line-height:38px; text-align:center;">{{VERIFICATION_CODE}}</div>
                <p style="margin:0 0 8px; color:#000000; font-size:14px; line-height:21px;">This code expires in 10 minutes.</p>
                <p style="margin:0; color:#000000; font-size:14px; line-height:21px;">If you did not request this code, you can safely ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px; background:#9d7a3c; color:#ffffff; font-size:12px; font-weight:700; letter-spacing:1px; line-height:18px;">REPLYFLOW</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
