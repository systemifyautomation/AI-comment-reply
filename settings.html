<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="extras.css"><title>ReplyFlow settings</title></head><body><main class="settings"><div class="eyebrow">ReplyFlow account</div><h1>Email verification</h1><p class="hint">Verify your email to access the agents assigned to your account.</p><form id="email-form" class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><button class="primary" type="submit">Email me a code</button></form><form id="code-form" class="field hidden"><label for="code">Verification code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" required><button class="primary" type="submit">Verify code</button></form><p id="status" class="notice" role="status"></p><section id="agents-section" class="hidden"><div class="section-head"><div><div class="eyebrow">Your access</div><h2>Available agents</h2></div><button id="refresh-agents" class="link" type="button">Refresh</button></div><ul id="agents" class="agent-list"></ul></section></main><script src="settings.js"></script></body></html>
